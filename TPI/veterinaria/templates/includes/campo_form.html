<div class="mb-3">
    <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">
        {{ campo.label }}
    </label>
    {{ campo }}
    {% if campo.help_text %}
        <div class="form-text">{{ campo.help_text }}</div>
    {% endif %}
    {% for error in campo.errors %}
        <div class="text-danger small mt-1">
            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
        </div>
    {% endfor %}
</div>
